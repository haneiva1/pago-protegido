[package]
name = "pp_integration_tests"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Crate solo de tests: no es un contrato y no se compila a WASM.
[lib]
path = "src/lib.rs"
doctest = false

[features]
# Los mismos tests contra el WASM de Trustless Work de mainnet: cargo test --features tw-mainnet
tw-mainnet = ["pp_guardian/tw-mainnet", "pp_arbiter/tw-mainnet"]

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
pp_guardian = { path = "../pp_guardian" }
pp_arbiter = { path = "../pp_arbiter" }
