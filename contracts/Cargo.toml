[workspace]
resolver = "2"
members = ["pp_guardian", "pp_arbiter", "integration-tests"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
# Misma versión exacta que Trustless Work (commit f0b706e fija soroban-sdk 28.0.0).
soroban-sdk = "=28.0.0"

# Mismo perfil de release que el repo de Trustless Work.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
